# Zentrale Parameter der Bank – einzige Quelle für Maße.
# Nach jeder Änderung:  python3 tools/build.py
# Das erzeugt cad/params.scad, Stückliste, Berechnung, Hanteln, Zeichnungen und Renderings neu.
# Alle Maße in mm, Gewichte in kg, Winkel in Grad.
# Gestaltung nach dem Bildentwurf: gerundete Ecken, Lamellen-Rolltür, Polster in einer Holzwanne,
# Rückenlehne links und Sitz rechts, beide neigbar, Eichensockel mit schwarzen Füßen.

[bank]
laenge    = 1400   # Bettende eines 180-cm-Betts (je Seite 20 cm Luft)
tiefe     = 430
hoehe     = 450    # Polsteroberkante: Sitzhöhe und Trainingshöhe zugleich
eckradius = 70     # senkrechte Korpusecken im Grundriss gerundet

[material]
aussen          = 24     # Korpus Eiche massiv (Deckel, Boden, Stirnseiten, Eckstollen, Frontleisten)
innen           = 18     # Trennwände, Fachböden, Rückwand: Multiplex eichefurniert
dichte_massiv   = 690    # kg/m³ Eiche
dichte_platte   = 680    # kg/m³ Multiplex
preis_massiv_m2 = 190    # €/m² Eiche-Leimholz 24 mm (Schätzung)
preis_platte_m2 = 95     # €/m² eichefurniertes Multiplex (Schätzung)
E_massiv        = 11000  # N/mm², Eiche in Faserrichtung
E_platte        = 7000   # N/mm², Multiplex flach belastet (konservativ)

[polster]
platte      = 18     # Trägerplatte mit sichtbarer Eichenkante unter dem Leder
schaum      = 50     # 30 mm hart (RG 50+) + 20 mm mittel (RG 35–40)
radius      = 12     # Rundung der Polsteroberkante
rand        = 20     # Korpusrand über dem Deckel: Polster liegen in einer Wanne
luft        = 12     # Spalt Polster ↔ Rand (dort sitzen die Gelenkplatten)
sitz_laenge = 400    # Sitz rechts
fuge        = 35     # zwischen Lehne und Sitz (Platz für die Polsterkanten bei steiler Lehne und geneigtem Sitz)

[mechanik]                    # gilt für Lehne und Sitz
achse_unter_oberkante = 25    # Drehachse so weit unter der Polsteroberfläche
stuetze_versatz       = 6     # Gelenkpunkt der Stütze unter der Polsterplatte
buegel_d              = 12    # Querstab der Stütze (Rundstahl)
rast_tiefe            = 8
leiste_breite         = 30
leiste_einzug         = 25    # Rastleiste innen vom Polsterrand
min_rastabstand       = 30
gelenkplatte          = 5     # Stahl, schwarz pulverbeschichtet
bein_breite           = 25    # Stützenbeine Flachstahl: Breite quer zur Bank
bein_dicke            = 8     # Dicke in der Klappebene (passt flach unter das Polster)
rippe_breite          = 60    # 2 Eichenrippen unter der Lehnenplatte
rippe_hoehe           = 18

[lehne]                       # links, hebt sich am linken Ende; Klappstütze rastet in zwei Leisten
winkel          = [25, 35, 45, 60, 75, 85]   # 0° = flach (Parkstellung)
stuetze_abstand = 390         # Stützengelenk ab Drehachse (python3 tools/build.py --stuetze-suchen)
stuetze_laenge  = 480
last_anteil     = 0.7         # Anteil des Körpergewichts auf der Lehne
last_abstand    = 350

[sitz]                        # rechts, hebt sich am rechten Ende (verhindert Herunterrutschen)
winkel          = [10, 20]    # je Winkel ein Klappbügel (wie die Stütze im Bildentwurf), ineinander geschachtelt
bock_abstand    = 340         # Bügel für den kleinsten Winkel, ab Drehachse
stufe           = 25          # jeder weitere Bügel so viel näher zur Achse
last_anteil     = 1.0
last_abstand    = 150

[korpus]
sockel_hoehe  = 45     # Eichenzarge + schwarze Füße
sockel_einzug = 25     # Zarge rundum zurückgesetzt
fuss_d        = 40
fuss_h        = 10
fuss_einzug   = 60     # Fußmitte ab Korpuskante
tasche        = 110    # Tasche links, in die die Rolltür einläuft
faecher       = [440, 440]   # Fachbreiten nach der Tasche; das letzte Fach rechts bekommt den Rest
fachboden     = true
fach_unten    = 130    # lichte Höhe der unteren Ebene
ablage_h      = 10     # schwarze Hantelablage unter den Köpfen

[rolltuer]
lamelle_breite = 18
lamelle_fuge   = 1.5
lamelle_dicke  = 14    # Vorderseite gerundet (Kannelur), auf Leinen geleimt
luft           = 3     # Abstand zur Vorderkante
biegeradius    = 50    # kleinster Radius der Laufnut
nut            = 8     # Laufnut für die Lamellenzapfen, Breite und Tiefe

[rollen]                # Absenkrollen mit Bronze-Fußhebel
anzahl      = 4
durchmesser = 40        # lenkbare Doppelrollen, parkettgeeignet
hub         = 6         # so weit hebt das Absenken die Bank von den Füßen
pedalweg    = 50

[last]
nutzer_kg = 120
dynamik   = 1.5

# Selbstgebaute Kurzhanteln: Stahlköpfe (Drehteile) + Eichengriff über Gewindestange.
# Die Kopflänge wird aus dem Zielgewicht berechnet; je Gewicht wird ein Paar gebaut.
[hanteln]
griff_laenge   = 125
griff_d        = 32
kern_d         = 16
gewinde_tiefe  = 25
fase           = 3
abflachung     = 4      # Hantel rollt nicht weg (0 = rund)
zugabe         = 2
dichte_stahl   = 7850
dichte_griff   = 690
preis_stahl_kg = 4
satz = [               # [kg je Hantel, Kopfdurchmesser]
  [2.5, 70],
  [3.5, 70],
  [5.0, 80],
  [7.5, 90],
  [10.0, 100],
]

# Weiteres Inventar für den Stauraum (Quader, Schätzwerte).
[inventar]
abstand = 15

[[inhalt]]
name = "Trainingsmatte (gefaltet)"
typ = "box"
breite = 340
hoehe = 60
tiefe = 300
kg = 1.5

[[inhalt]]
name = "Widerstandsbänder (3 Stück)"
typ = "box"
breite = 160
hoehe = 60
tiefe = 250
kg = 0.6

[[inhalt]]
name = "Gewichtsmanschetten/Knuckles (3 Paar)"
typ = "box"
breite = 160
hoehe = 70
tiefe = 220
kg = 4.9
