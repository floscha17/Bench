</style><rect class="bg" width="1150" height="760"/><text class="titel" x="20" y="32">Metallteile – Entwurfsmaße für den Metallbau</text><text class="tk" x="20" y="50">Maße in mm. Stahl S235, schwarz pulverbeschichtet. Fertigungszeichnung durch den Metallbau nach Aufmaß am Korpus.</text><text class="ut" x="40" y="90">Gelenkplatte Korpus (2×)</text><polygon class="stahl" points="97.6,330.0 198.4,330.0 198.4,320.4 193.6,229.2 176.0,211.6 120.0,211.6 102.4,229.2 97.6,320.4"/><circle class="bg" cx="120.0" cy="229.2" r="8.4"/><circle class="bg" cx="176.0" cy="229.2" r="8.4"/><line class="m" x1="120.0" y1="330.0" x2="242.4" y2="330.0"/><line class="m" x1="120.0" y1="229.2" x2="242.4" y2="229.2"/><line class="m" x1="238.4" y1="330.0" x2="238.4" y2="229.2"/><line class="m" x1="235.4" y1="333.0" x2="241.4" y2="327.0"/><line class="m" x1="235.4" y1="232.2" x2="241.4" y2="226.2"/><text class="mt" x="234.4" y="279.6" text-anchor="middle" transform="rotate(-90 234.4 279.6)">63</text><line class="m" x1="120.0" y1="229.2" x2="120.0" y2="185.2"/><line class="m" x1="176.0" y1="229.2" x2="176.0" y2="185.2"/><line class="m" x1="120.0" y1="189.2" x2="176.0" y2="189.2"/><line class="m" x1="117.0" y1="192.2" x2="123.0" y2="186.2"/><line class="m" x1="173.0" y1="192.2" x2="179.0" y2="186.2"/><text class="mt" x="148.0" y="186.2" text-anchor="middle">35</text><text class="tk" x="97.6" y="394.0" text-anchor="start">Dicke 5, Bohrungen Ø 10,5 (Bolzen M10)</text><text class="tk" x="97.6" y="410.0" text-anchor="start">Fuß 90 mm nach innen gekantet, 4 × M6 durch Deckel</text><text class="tk" x="97.6" y="426.0" text-anchor="start">auf Gegenplatte 140 × 60 × 6 unter dem Deckel</text><text class="ut" x="330" y="90">Gelenkplatte Lehne / Sitz (4×)</text><polygon class="stahl" points="400.0,243.6 382.4,261.2 419.2,330.0 491.2,330.0 491.2,323.6 417.6,251.6"/><circle class="bg" cx="400.0" cy="261.2" r="8.4"/><line class="m" x1="400.0" y1="330.0" x2="525.2" y2="330.0"/><line class="m" x1="400.0" y1="261.2" x2="525.2" y2="261.2"/><line class="m" x1="521.2" y1="330.0" x2="521.2" y2="261.2"/><line class="m" x1="518.2" y1="333.0" x2="524.2" y2="327.0"/><line class="m" x1="518.2" y1="264.2" x2="524.2" y2="258.2"/><text class="mt" x="517.2" y="295.6" text-anchor="middle" transform="rotate(-90 517.2 295.6)">43</text><line class="m" x1="400.0" y1="330.0" x2="400.0" y2="354.0"/><line class="m" x1="491.2" y1="330.0" x2="491.2" y2="354.0"/><line class="m" x1="400.0" y1="350.0" x2="491.2" y2="350.0"/><line class="m" x1="397.0" y1="353.0" x2="403.0" y2="347.0"/><line class="m" x1="488.2" y1="353.0" x2="494.2" y2="347.0"/><text class="mt" x="445.6" y="347.0" text-anchor="middle">57</text><text class="tk" x="382.4" y="394.0" text-anchor="start">Lasche unter die Polsterplatte gekantet,</text><text class="tk" x="382.4" y="410.0" text-anchor="start">3 × Senkschraube in Einschlagmuttern</text><text class="ut" x="610" y="90">Klappbügel Sitz (je Stellung 1×)</text><rect class="stahl" x="640.0" y="226.9" width="10.4" height="103.1" rx="0.0"/><rect class="stahl" x="634.8" y="226.9" width="20.8" height="10.4" rx="0.0"/><circle class="bg" cx="650.4" cy="324.8" r="3.9"/><line class="m" x1="650.4" y1="330.0" x2="672.4" y2="330.0"/><line class="m" x1="650.4" y1="226.9" x2="672.4" y2="226.9"/><line class="m" x1="668.4" y1="330.0" x2="668.4" y2="226.9"/><line class="m" x1="665.4" y1="333.0" x2="671.4" y2="327.0"/><line class="m" x1="665.4" y1="229.9" x2="671.4" y2="223.9"/><text class="mt" x="664.4" y="278.5" text-anchor="middle" transform="rotate(-90 664.4 278.5)">79</text><text class="t" x="645.2" y="350.8" text-anchor="middle">10°</text><text class="tk" x="645.2" y="366.4" text-anchor="middle">bei 340</text><rect class="stahl" x="731.0" y="158.5" width="10.4" height="171.5" rx="0.0"/><rect class="stahl" x="725.8" y="158.5" width="20.8" height="10.4" rx="0.0"/><circle class="bg" cx="741.4" cy="324.8" r="3.9"/><line class="m" x1="741.4" y1="330.0" x2="763.4" y2="330.0"/><line class="m" x1="741.