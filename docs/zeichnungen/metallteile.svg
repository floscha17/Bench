rstab Ø 12 × 298</text><text class="tk" x="930.0" y="695.0" text-anchor="start">Beine Flachstahl 25 × 8</text><text class="t" x="40" y="680">Drehachsen: Lehne bei x = 929, Sitz bei x = 964 mm ab linker Stirnseite, 63 mm über dem Deckel. Bolzen M10 mit Gleitlagerbuchse.</text><text class="t" x="40" y="698">Stützengelenk Lehne: 390 mm von der Achse, 6 mm unter der Lehnenplatte, Lagerböcke an den Eichenrippen.</text><text class="t" x="40" y="716">Absenkrollen: 4 lenkbare Doppelrollen Ø 40 auf Hubplatten, Exzenterwelle längs im Sockel, Hub 6 mm, Bronze-Fußhebel vorn rechts mit Totpunktrast in beiden Lagen.</text><text class="t" x="40" y="734">Alternative zur Eigenkonstruktion: fertiges Hubrollen-System (wie bei Werkbänken), verdeckt in die Sockelzarge eingebaut.</text></svg>
