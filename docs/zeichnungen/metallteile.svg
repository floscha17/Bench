</style><rect class="bg" width="1100" height="700"/><text class="titel" x="20" y="32">Metallteile – Entwurfsmaße für den Metallbau</text><text class="tk" x="20" y="50">Maße in mm. Stahl S235, schwarz pulverbeschichtet. Endgültige Fertigungszeichnung durch Metallbau nach Aufmaß am Korpus.</text><text class="ut" x="40" y="90">Gelenkplatte Korpus (2×, außen)</text><polygon class="stahl" points="72.0,330.0 132.8,330.0 132.8,320.4 137.6,229.2 120.0,211.6 102.4,229.2 72.0,320.4"/><circle class="bg" cx="120.0" cy="229.2" r="8.4"/><line class="m" x1="120.0" y1="330.0" x2="181.6" y2="330.0"/><line class="m" x1="120.0" y1="229.2" x2="181.6" y2="229.2"/><line class="m" x1="177.6" y1="330.0" x2="177.6" y2="229.2"/><line class="m" x1="174.6" y1="333.0" x2="180.6" y2="327.0"/><line class="m" x1="174.6" y1="232.2" x2="180.6" y2="226.2"/><text class="mt" x="173.6" y="279.6" text-anchor="middle" transform="rotate(-90 173.6 279.6)">63</text><line class="m" x1="72.0" y1="330.0" x2="72.0" y2="354.0"/><line class="m" x1="120.0" y1="330.0" x2="120.0" y2="354.0"/><line class="m" x1="72.0" y1="350.0" x2="120.0" y2="350.0"/><line class="m" x1="69.0" y1="353.0" x2="75.0" y2="347.0"/><line class="m" x1="117.0" y1="353.0" x2="123.0" y2="347.0"/><text class="mt" x="96.0" y="347.0" text-anchor="middle">30</text><line class="m" x1="120.0" y1="330.0" x2="120.0" y2="354.0"/><line class="m" x1="132.8" y1="330.0" x2="132.8" y2="354.0"/><line class="m" x1="120.0" y1="350.0" x2="132.8" y2="350.0"/><line class="m" x1="117.0" y1="353.0" x2="123.0" y2="347.0"/><line class="m" x1="129.8" y1="353.0" x2="135.8" y2="347.0"/><text class="mt" x="126.4" y="347.0" text-anchor="middle">8</text><text class="tk" x="72.0" y="394.0" text-anchor="start">Dicke 5, Bohrung Ø 10,5 für Bolzen M10,</text><text class="tk" x="72.0" y="410.0" text-anchor="start">Fuß 90 mm unter den Sitz gekantet, 4 × M6 durch Deckel</text><text class="ut" x="380" y="90">Gelenkplatte Lehne (2×, innen)</text><polygon class="stahl" points="470.0,243.6 452.4,261.2 489.2,330.0 561.2,330.0 561.2,323.6 487.6,251.6"/><circle class="bg" cx="470.0" cy="261.2" r="8.4"/><line class="m" x1="470.0" y1="330.0" x2="595.2" y2="330.0"/><line class="m" x1="470.0" y1="261.2" x2="595.2" y2="261.2"/><line class="m" x1="591.2" y1="330.0" x2="591.2" y2="261.2"/><line class="m" x1="588.2" y1="333.0" x2="594.2" y2="327.0"/><line class="m" x1="588.2" y1="264.2" x2="594.2" y2="258.2"/><text class="mt" x="587.2" y="295.6" text-anchor="middle" transform="rotate(-90 587.2 295.6)">43</text><line class="m" x1="470.0" y1="330.0" x2="470.0" y2="354.0"/><line class="m" x1="561.2" y1="330.0" x2="561.2" y2="354.0"/><line class="m" x1="470.0" y1="350.0" x2="561.2" y2="350.0"/><line class="m" x1="467.0" y1="353.0" x2="473.0" y2="347.0"/><line class="m" x1="558.2" y1="353.0" x2="564.2" y2="347.0"/><text class="mt" x="515.6" y="347.0" text-anchor="middle">57</text><text class="tk" x="452.4" y="394.0" text-anchor="start">Lasche unter die Lehnenplatte gekantet,</text><text class="tk" x="452.4" y="410.0" text-anchor="start">3 × Senkschraube in Einschlagmuttern</text><text class="ut" x="700" y="90">Klappstütze (1×, geschweißt)</text><rect class="stahl" x="734.9" y="180.5" width="13.8" height="269.5"/><circle class="bg" cx="741.7" cy="180.5" r="2.3"/><rect class="stahl" x="861.9" y="180.5" width="13.8" height="269.5"/><circle class="bg" cx="868.8" cy="180.5" r="2.3"/><rect class="stahl" x="720.0" y="446.7" width="170.5" height="6.6"/><line class="m" x1="868.8" y1="450.0" x2="909.6" y2="450.0"/><line class="m" x1="868.8" y1="180.5" x2="909.6" y2="180.5"/><line class="m" x1="905.6" y1="450.0" x2="905.6" y2="180.5"/><line class="m" x1="902.6" y1="453.0" x2="908.6" y2="447.0"/><line class="m" x1="902.6" y1="183.5" x2="908.6" y2="177.5"/><text class="mt" x="901.6" y="315.2" text-anchor="middle" transform="rotate(-90 901.6 315.2)">490 Bohrung–Stabmitte</text><line class="m" x1="720.0" y1="450.0" x2="720.0" y2="484.0"/><line class="m" x1="890.5" y1="450.0" x